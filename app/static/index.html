<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SetuHaul Driver Chat</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #10162a;
    --panel-2: #1a2140;
    --border: #2b3560;
    --text: #eef1fb;
    --muted: #98a2d4;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --accent-text: #ffffff;
    --header-grad: linear-gradient(135deg, #6366f1 0%, #7c3aed 55%, #22d3ee 100%);
    --agent-bubble: #1c2444;
    --system: #3a2f1e;
    --system-text: #f0c674;
    --escalated: #3a1522;
    --escalated-text: #ff7aa2;
    --ok: #34d399;
    --lang-tint: rgba(34, 211, 238, 0.14);
    --lang-border: #22d3ee;
    --issue-tint: rgba(251, 146, 60, 0.14);
    --issue-border: #fb923c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f2fc;
      --panel: #ffffff;
      --panel-2: #f1f2fd;
      --border: #dde1f7;
      --text: #181c34;
      --muted: #5c6491;
      --accent: #4f46e5;
      --accent-2: #0891b2;
      --header-grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #0891b2 100%);
      --agent-bubble: #eef0fc;
      --system: #fff4da;
      --system-text: #8a6300;
      --escalated: #ffe4ec;
      --escalated-text: #c0265a;
      --ok: #059669;
      --lang-tint: rgba(8, 145, 178, 0.09);
      --lang-border: #0891b2;
      --issue-tint: rgba(234, 88, 12, 0.09);
      --issue-border: #ea580c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(79, 70, 229, 0.15);
  }
  body {
    background-image: radial-gradient(circle at 15% 0%, rgba(99, 102, 241, 0.16), transparent 45%),
                       radial-gradient(circle at 85% 100%, rgba(34, 211, 238, 0.12), transparent 45%);
    background-attachment: fixed;
  }
  header {
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    background-image: var(--header-grad);
    color: #ffffff;
  }
  header .title { font-weight: 700; font-size: 15px; flex-shrink: 0; color: #ffffff; }
  header .sub { font-size: 12px; color: rgba(255, 255, 255, 0.8); flex-shrink: 0; }
  header .driver-badge {
    margin-left: auto;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  header .switch-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.85);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
    flex-shrink: 0;
  }
  header .switch-btn:hover { color: #ffffff; }
  .escalated-banner {
    display: none;
    padding: 10px 16px;
    background: var(--escalated);
    color: var(--escalated-text);
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    border-left: 4px solid var(--escalated-text);
  }
  .escalated-banner.show { display: block; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; }
  .row.driver { justify-content: flex-end; }
  .row.agent { justify-content: flex-start; }
  .row.system { justify-content: center; }
  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.driver .bubble {
    background-image: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 10px rgba(79, 70, 229, 0.25);
  }
  .row.agent .bubble {
    background: var(--agent-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }
  .row.system .bubble {
    background: var(--system);
    color: var(--system-text);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    max-width: 90%;
    text-align: center;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 24px;
  }
  .typing { display: flex; gap: 4px; padding: 10px 13px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #msg {
    flex: 1;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    resize: none;
    font-family: inherit;
  }
  #msg:focus { outline: 2px solid var(--accent); }
  button#send {
    padding: 0 20px;
    border-radius: 10px;
    border: none;
    background-image: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-text);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(79, 70, 229, 0.3);
  }
  button#send:disabled { opacity: .5; cursor: default; box-shadow: none; }
  .error-banner {
    display: none;
    padding: 8px 16px;
    background: var(--escalated);
    color: var(--escalated-text);
    font-size: 12px;
    border-left: 4px solid var(--escalated-text);
  }
  .error-banner.show { display: block; }
  .chips-inline {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 78%;
    margin-top: 2px;
  }
  .chip {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .chip.lang { background: var(--lang-tint); border-color: var(--lang-border); color: var(--lang-border); }
  .chip.issue { background: var(--issue-tint); border-color: var(--issue-border); color: var(--issue-border); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="title">SetuHaul</span>
      <span class="sub">Driver Chat</span>
      <span id="driverBadge" class="driver-badge" style="display:none"></span>
      <button type="button" id="switchDriver" class="switch-btn" style="display:none">Switch driver</button>
    </header>
    <div id="escalatedBanner" class="escalated-banner">This conversation has been escalated to a human coordinator.</div>
    <div id="errorBanner" class="error-banner"></div>
    <div id="log"></div>
    <form id="composer">
      <textarea id="msg" rows="1" placeholder="Type a message..." autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
const logEl = document.getElementById('log');
const driverBadge = document.getElementById('driverBadge');
const switchDriverBtn = document.getElementById('switchDriver');
const msgEl = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const escalatedBanner = document.getElementById('escalatedBanner');
const errorBanner = document.getElementById('errorBanner');
const form = document.getElementById('composer');

let driverId = localStorage.getItem('setuhaul_driver_id') || null;
let driverMessageCount = 0;

const SENDER_ROW_CLASS = { DRIVER: 'driver', AGENT: 'agent', SYSTEM: 'system', OPERATIONS: 'system', WAREHOUSE: 'system' };

// Two distinct chip sets, shown inline under the specific bot message they
// answer -- language first (the bot's opening message asks only this), then
// issue chips under the bot's second message (the grounded greeting that
// asks what's going on). Never both at once, never pinned to the composer.
const LANGUAGE_CHIPS = [
  { label: 'English', text: 'Please continue in English' },
  { label: 'हिंदी', text: 'हिंदी में बात करें' },
];
const ISSUE_CHIPS = [
  { label: '🔧 Vehicle breakdown', text: 'My vehicle broke down' },
  { label: '🚦 Stuck in traffic', text: "I'm stuck in traffic and running late" },
  { label: '⚠️ Accident', text: "I've been in an accident" },
  { label: '💬 Something else', text: 'Something else' },
];

function showError(text) {
  errorBanner.textContent = text;
  errorBanner.classList.add('show');
}
function clearError() {
  errorBanner.classList.remove('show');
}

function scrollToBottom() {
  logEl.scrollTop = logEl.scrollHeight;
}

function renderEmptyState(text) {
  logEl.innerHTML = `<div class="empty-state">${text}</div>`;
}

function addMessage(sender, text) {
  logEl.querySelector('.empty-state')?.remove();
  const row = document.createElement('div');
  row.className = 'row ' + (SENDER_ROW_CLASS[sender] || 'agent');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  logEl.appendChild(row);
  scrollToBottom();
  return row;
}

function addTypingIndicator() {
  const row = document.createElement('div');
  row.className = 'row agent';
  row.id = 'typingRow';
  row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  logEl.appendChild(row);
  scrollToBottom();
}
function removeTypingIndicator() {
  document.getElementById('typingRow')?.remove();
}

function setEscalated(isEscalated) {
  escalatedBanner.classList.toggle('show', !!isEscalated);
}

function updateDriverBadge() {
  if (driverId) {
    driverBadge.textContent = driverId;
    driverBadge.style.display = '';
    switchDriverBtn.style.display = '';
  } else {
    driverBadge.style.display = 'none';
    switchDriverBtn.style.display = 'none';
  }
}

function removeInlineChips() {
  logEl.querySelector('.chips-inline')?.remove();
}

function addInlineChips(afterRow, chips, kind) {
  removeInlineChips();
  const row = document.createElement('div');
  row.className = 'chips-inline';
  chips.forEach(c => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (kind ? ' ' + kind : '');
    btn.textContent = c.label;
    btn.addEventListener('click', () => {
      removeInlineChips();
      msgEl.value = c.text;
      form.requestSubmit();
    });
    row.appendChild(btn);
  });
  afterRow.insertAdjacentElement('afterend', row);
  scrollToBottom();
}

// The bot's opening message (turn 1) only asks language; its second message
// (turn 2) is the grounded greeting asking what's going on. Map that onto
// driverMessageCount so the right chip set (color-coded: cyan for language,
// amber for issue) lands under the right bubble.
function attachChipsForTurn(row, lastSender) {
  if (lastSender !== 'AGENT') return;
  if (driverMessageCount === 1) addInlineChips(row, LANGUAGE_CHIPS, 'lang');
  else if (driverMessageCount === 2) addInlineChips(row, ISSUE_CHIPS, 'issue');
}

// Matches "DRV001", "drv1", "DRV 12", etc. and normalizes to the DRV0xx
// format the backend's seed data uses -- this is a pure client-side parse,
// nothing is sent to the backend until a driver ID has been recognized.
function extractDriverId(text) {
  const m = text.match(/\bDRV[\s-]?0*(\d{1,4})\b/i);
  if (!m) return null;
  return 'DRV' + m[1].padStart(3, '0');
}

function showIdGateGreeting() {
  logEl.innerHTML = '';
  addMessage('AGENT', "Hi! I'm the SetuHaul driver assistant. What's your Driver ID? (e.g. DRV001)");
}

async function loadHistory() {
  logEl.innerHTML = '';
  driverMessageCount = 0;
  try {
    const res = await fetch(`/chat/history/${encodeURIComponent(driverId)}`);
    if (!res.ok) throw new Error('history request failed');
    const data = await res.json();
    if (!data.messages || data.messages.length === 0) {
      renderEmptyState('Say hi to get started.');
    } else {
      let lastRow = null;
      data.messages.forEach(m => { lastRow = addMessage(m.sender_type, m.message_text); });
      driverMessageCount = data.messages.filter(m => m.sender_type === 'DRIVER').length;
      const lastSender = data.messages[data.messages.length - 1].sender_type;
      attachChipsForTurn(lastRow, lastSender);
    }
    setEscalated(data.thread_status === 'ESCALATED');
  } catch (e) {
    showError('Could not load conversation history.');
  }
}

async function sendToBackend(text) {
  driverMessageCount += 1;
  sendBtn.disabled = true;
  addTypingIndicator();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ driver_id: driverId, message: text }),
    });
    removeTypingIndicator();
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      showError(body.detail || `Request failed (${res.status}).`);
      return;
    }
    const data = await res.json();
    const row = addMessage('AGENT', data.reply);
    setEscalated(data.escalated);
    attachChipsForTurn(row, 'AGENT');
  } catch (err) {
    removeTypingIndicator();
    showError('Network error -- is the server running?');
  } finally {
    sendBtn.disabled = false;
  }
}

switchDriverBtn.addEventListener('click', () => {
  localStorage.removeItem('setuhaul_driver_id');
  driverId = null;
  driverMessageCount = 0;
  updateDriverBadge();
  clearError();
  setEscalated(false);
  showIdGateGreeting();
  msgEl.focus();
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = msgEl.value.trim();
  if (!text) return;

  clearError();
  removeInlineChips();
  addMessage('DRIVER', text);
  msgEl.value = '';
  msgEl.style.height = 'auto';

  if (!driverId) {
    // Identity gate: parse a driver ID out of what they typed, client-side
    // only -- nothing hits the backend until we have one.
    const extracted = extractDriverId(text);
    if (!extracted) {
      addMessage('AGENT', "Sorry, I didn't catch a driver ID there -- please enter it like DRV001.");
      return;
    }
    driverId = extracted;
    localStorage.setItem('setuhaul_driver_id', driverId);
    updateDriverBadge();
    // Send their original message as-is: if they said "DRV005, my truck
    // broke down" the backend's existing first-turn handling already deals
    // with a concrete issue stated up front, grounded in real shipment data.
    await sendToBackend(text);
    return;
  }

  await sendToBackend(text);
});

msgEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
msgEl.addEventListener('input', () => {
  msgEl.style.height = 'auto';
  msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + 'px';
});

updateDriverBadge();
if (driverId) {
  loadHistory();
} else {
  showIdGateGreeting();
}
</script>
</body>
</html>
