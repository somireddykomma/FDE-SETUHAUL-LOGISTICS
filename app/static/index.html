<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SetuHaul Driver Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #8b93a1;
    --accent: #4f8cff;
    --accent-text: #ffffff;
    --agent-bubble: #262b35;
    --system: #3a2f1e;
    --system-text: #e8c887;
    --escalated: #3a1e22;
    --escalated-text: #ff8a8a;
    --ok: #2ecc71;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --panel-2: #f0f1f4;
      --border: #dde1e8;
      --text: #1a1d23;
      --muted: #6b7280;
      --agent-bubble: #eef0f4;
      --system: #fff4da;
      --system-text: #8a6300;
      --escalated: #ffe4e4;
      --escalated-text: #b3261e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header .title { font-weight: 600; font-size: 15px; flex-shrink: 0; }
  header .sub { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  header input {
    margin-left: auto;
    width: 120px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13px;
  }
  header input:focus { outline: 2px solid var(--accent); }
  .escalated-banner {
    display: none;
    padding: 8px 16px;
    background: var(--escalated);
    color: var(--escalated-text);
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .escalated-banner.show { display: block; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; }
  .row.driver { justify-content: flex-end; }
  .row.agent { justify-content: flex-start; }
  .row.system { justify-content: center; }
  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.driver .bubble { background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: var(--agent-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .row.system .bubble {
    background: var(--system);
    color: var(--system-text);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    max-width: 90%;
    text-align: center;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 24px;
  }
  .typing { display: flex; gap: 4px; padding: 10px 13px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #msg {
    flex: 1;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
    resize: none;
    font-family: inherit;
  }
  #msg:focus { outline: 2px solid var(--accent); }
  button#send {
    padding: 0 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  button#send:disabled { opacity: .5; cursor: default; }
  .error-banner {
    display: none;
    padding: 8px 16px;
    background: var(--escalated);
    color: var(--escalated-text);
    font-size: 12px;
  }
  .error-banner.show { display: block; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="title">SetuHaul</span>
      <span class="sub">Driver Chat</span>
      <input id="driverId" placeholder="Driver ID" autocomplete="off" spellcheck="false">
    </header>
    <div id="escalatedBanner" class="escalated-banner">This conversation has been escalated to a human coordinator.</div>
    <div id="errorBanner" class="error-banner"></div>
    <div id="log"></div>
    <form id="composer">
      <textarea id="msg" rows="1" placeholder="Type a message..." autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
const logEl = document.getElementById('log');
const driverIdEl = document.getElementById('driverId');
const msgEl = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const escalatedBanner = document.getElementById('escalatedBanner');
const errorBanner = document.getElementById('errorBanner');
const form = document.getElementById('composer');

const SENDER_ROW_CLASS = { DRIVER: 'driver', AGENT: 'agent', SYSTEM: 'system', OPERATIONS: 'system', WAREHOUSE: 'system' };

function showError(text) {
  errorBanner.textContent = text;
  errorBanner.classList.add('show');
}
function clearError() {
  errorBanner.classList.remove('show');
}

function scrollToBottom() {
  logEl.scrollTop = logEl.scrollHeight;
}

function renderEmptyState() {
  logEl.innerHTML = '<div class="empty-state">Enter a driver ID above to start or resume a conversation.</div>';
}

function addMessage(sender, text) {
  logEl.querySelector('.empty-state')?.remove();
  const row = document.createElement('div');
  row.className = 'row ' + (SENDER_ROW_CLASS[sender] || 'agent');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  logEl.appendChild(row);
  scrollToBottom();
  return row;
}

function addTypingIndicator() {
  const row = document.createElement('div');
  row.className = 'row agent';
  row.id = 'typingRow';
  row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  logEl.appendChild(row);
  scrollToBottom();
}
function removeTypingIndicator() {
  document.getElementById('typingRow')?.remove();
}

function setEscalated(isEscalated) {
  escalatedBanner.classList.toggle('show', !!isEscalated);
}

function currentDriverId() {
  return driverIdEl.value.trim();
}

async function loadHistory(driverId) {
  logEl.innerHTML = '';
  if (!driverId) { renderEmptyState(); setEscalated(false); return; }
  try {
    const res = await fetch(`/chat/history/${encodeURIComponent(driverId)}`);
    if (!res.ok) throw new Error('history request failed');
    const data = await res.json();
    if (!data.messages || data.messages.length === 0) {
      renderEmptyState();
    } else {
      data.messages.forEach(m => addMessage(m.sender_type, m.message_text));
    }
    setEscalated(data.thread_status === 'ESCALATED');
  } catch (e) {
    showError('Could not load conversation history.');
  }
}

driverIdEl.addEventListener('change', () => {
  const id = currentDriverId();
  localStorage.setItem('setuhaul_driver_id', id);
  clearError();
  loadHistory(id);
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const driverId = currentDriverId();
  const text = msgEl.value.trim();
  if (!driverId) { showError('Enter a driver ID first.'); driverIdEl.focus(); return; }
  if (!text) return;

  clearError();
  addMessage('DRIVER', text);
  msgEl.value = '';
  msgEl.style.height = 'auto';
  sendBtn.disabled = true;
  addTypingIndicator();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ driver_id: driverId, message: text }),
    });
    removeTypingIndicator();
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      showError(body.detail || `Request failed (${res.status}).`);
      return;
    }
    const data = await res.json();
    addMessage('AGENT', data.reply);
    setEscalated(data.escalated);
  } catch (err) {
    removeTypingIndicator();
    showError('Network error -- is the server running?');
  } finally {
    sendBtn.disabled = false;
  }
});

msgEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
msgEl.addEventListener('input', () => {
  msgEl.style.height = 'auto';
  msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + 'px';
});

// Restore last-used driver id, if any.
const saved = localStorage.getItem('setuhaul_driver_id');
if (saved) {
  driverIdEl.value = saved;
  loadHistory(saved);
} else {
  renderEmptyState();
}
</script>
</body>
</html>
